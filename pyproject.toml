[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aerosentinel"
version = "0.1.0"
description = "AI-powered autonomous drone disaster search-and-rescue system for Raspberry Pi 4B"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["drone", "sar", "search-rescue", "yolo", "realsense", "raspberry-pi", "computer-vision"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "numpy>=2.1.0,<3.0.0",
    "opencv-python-headless>=4.10.0,<5.0.0",
    "onnxruntime>=1.20.0,<2.0.0",
    "fastapi>=0.104.1,<1.0.0",
    "uvicorn[standard]>=0.24.0,<1.0.0",
    "websockets>=12.0,<15.0",
    "pymavlink>=2.4.41,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "structlog>=23.2.0,<25.0.0",
    "sqlalchemy>=2.0.23,<3.0.0",
    "aiofiles>=23.2.1,<25.0.0",
    "jinja2>=3.1.2,<4.0.0",
    "pillow>=10.4.0,<12.0.0",
    "psutil>=6.0.0,<8.0.0",
    "click>=8.1.7,<9.0.0",
    "python-multipart>=0.0.6,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.7.1",
    "pre-commit>=3.5.0",
]
simulation = [
    "faker>=20.1.0",
]
docs = [
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.4.0",
]

[project.scripts]
aerosentinel = "aerosentinel.dashboard.app:main"
aerosentinel-check = "aerosentinel.sensors.sensor_health:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312", "py313"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/simulation/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
