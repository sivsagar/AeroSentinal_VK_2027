system:
  name: AeroSentinel
  version: "0.1.0"
  team_id: VK26-AU-PAI-0399
  mock_mode: false          # set true for simulation without hardware
  log_level: INFO
  data_dir: data/
  log_dir: data/logs/

performance:
  cpu_warning_temp_c: 75
  cpu_critical_temp_c: 85
  min_free_ram_mb: 200
  watchdog_interval_s: 5

loop:
  loop_hz: 10.0

dashboard:
  dashboard_video_fps: 7
  dashboard_telemetry_hz: 2
  dashboard_jpeg_quality: 65
